name: Build Director images

on:
  push:
    branches: [main]
    paths:
      - "services/director-api/**"
      - "services/oneforall-director-mcp/**"
      - ".github/workflows/director-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: director-api
            image: oneforall-director-api
          - service: oneforall-director-mcp
            image: oneforall-director-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/oneforall-dev/${{ matrix.image }}:character-vault-2026-10-03
            ghcr.io/oneforall-dev/${{ matrix.image }}:creative-owner-2026-09-30
            ghcr.io/oneforall-dev/${{ matrix.image }}:latest
